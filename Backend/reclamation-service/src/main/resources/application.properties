# ===== MS3 Reclamations (Mohamed Rhouma) =====
spring.application.name=ms3-reclamations
server.port=${PORT:8083}

# H2 en memoire : modele simple, demarrage rapide (chaque instance a ses propres donnees)
spring.datasource.url=jdbc:h2:mem:claimsdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# executer data.sql APRES la creation des tables par Hibernate
spring.jpa.defer-datasource-initialization=true

# ===== Eureka : enregistrement aupres des DEUX serveurs =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka,http://localhost:8762/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# identifiant unique par port => 2 instances distinctes visibles dans le dashboard
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===== Actuator (observabilite) =====
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
# Eureka recoit le vrai statut de /actuator/health (UP / DOWN)
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true
info.app.name=ms3-reclamations
info.app.version=1.0.0
info.app.description=Depot et suivi des reclamations des etudiants
info.app.owner=Mohamed Rhouma
info.app.team=UniLearn - Ayoub Jleli, Ameni Ltaifi, Mohamed Rhouma, Akrem Jouini
