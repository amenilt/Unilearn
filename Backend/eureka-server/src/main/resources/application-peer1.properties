# ===== Homework : instance 1 du cluster Eureka (port 8761) =====
# Lancer avec : mvn spring-boot:run -Dspring-boot.run.profiles=peer1
spring.application.name=eureka
server.port=8761
eureka.instance.hostname=localhost

# En cluster, chaque serveur s'enregistre aupres de l'autre et replique le registre
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://127.0.0.1:8762/eureka/
