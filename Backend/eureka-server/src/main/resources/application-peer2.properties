# ===== Homework : instance 2 du cluster Eureka (port 8762) =====
# Lancer avec : mvn spring-boot:run -Dspring-boot.run.profiles=peer2
# Astuce : on utilise 127.0.0.1 ici et localhost dans peer1, sinon Eureka considere
# que les deux serveurs sont la meme machine et marque le replica "unavailable".
spring.application.name=eureka
server.port=8762
eureka.instance.hostname=127.0.0.1

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
