server:
  port: ${SERVER_PORT:8084}

spring:
  data:
    mongodb:
      uri: ${MS4_MONGO_URI:mongodb://localhost:27017/unilearn_forum}

eureka:
  client:
    service-url:
      # deux serveurs Eureka : 8761 et 8762
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # un id par port pour voir les 2 instances dans le dashboard
    instance-id: ${spring.application.name}:${server.port}

# ===== Observabilite (Actuator) =====
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: UniLearn - MS4 Forum Q&A
    description: Questions, reponses, votes (Spring Boot + MongoDB)
    version: 1.0.0-SNAPSHOT

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
