server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms4-forum
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  # Valeurs par defaut si le Config Server n'est pas lance
  # (la configuration complete est dans infra/config/ms4-forum.yml)
  data:
    mongodb:
      uri: ${MS4_MONGO_URI:mongodb://localhost:27017/unilearn_forum}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: UniLearn - MS4 Forum Q&A
    description: Questions, reponses, votes (Spring Boot + MongoDB)
    version: 1.0.0-SNAPSHOT
